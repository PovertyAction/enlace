[project]
name = "enlace"
version = "0.1.0"
description = "Extract and harmonize data from development economics research papers"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.5.0",
    "camelot-py[base]>=0.11.0",
    "chromadb>=0.5.23",
    "docling[easyocr,tesserocr,vlm]>=2.60.1",
    "duckdb>=1.1.3",
    "great-tables>=0.15.0",
    "ipykernel>=6.29.5",
    "jupyter>=1.1.1",
    "jupytext>=1.17.2",
    "langchain>=0.3.22",
    "langchain-anthropic>=0.3.9",
    "langchain-chroma>=0.2.2",
    "langchain-huggingface>=0.1.4",
    "langchain-text-splitters>=1.0.0",
    "nbstata>=0.8.3",
    "pandas>=2.2.3",
    "pdfplumber>=0.11.0",
    "pydantic>=2.12.4",
    "pydantic-settings>=2.0.0",
    "pyfixest>=0.50.1",
    "pypdf>=5.5.0",
    "python-dotenv>=1.0.0",
    "rapidfuzz>=3.0.0",
    "rich>=13.0.0",
    "sentence-transformers>=3.4.0",
    "stata-setup>=0.1.3",
    "typer>=0.12.0",
]

[project.scripts]
enlace = "enlace.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.12.0",
    "reportlab>=4.0.0",
    "codespell>=2.4.1",
    "pre-commit>=4.2.0",
    "ruff>=0.7.4",
]

[tool.ruff]
line-length = 88
fix = true
# Assume Python 3.12
target-version = "py312"
exclude = [
    ".claude/skills/",
    ".claude/subagents/",
]

[tool.ruff.lint]
# docs: https://docs.astral.sh/ruff/rules/
select = [
    "F",   # Pyflakes
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "I",   # isort
    "D",   # flake8-docstrings
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]

ignore = [
    # do not enable if formatting
    # docs: https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "W191",   # tab indentation
    "E111",   # indentation
    "E114",   # indentation
    "E117",   # over indented
    "D206",   # indent with spaces
    "D300",   # triple single quotes
    "E501",   # line length regulated by formatter
    "D105",   # missing docstring in magic method
    "D100",   # missing docstring in public module
    "D104",   # missing docstring in public package
    "SIM110", # Use all instead of `for` loop
    "TRY003", # Avoid specifying long messages outside the exception class
    "D205",   # 1 blank line required between summary line and description
    "D203",
    "D213",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"
markers = [
    "unit: Fast unit tests with mocked dependencies",
    "integration: Integration tests that test multiple components together",
    "slow: Tests that take longer to run (require actual models, etc.)",
]

[tool.codespell]
builtin = "clear,rare,informal,usage,code,names"
ignore-words-list = "jupyter,ipa,hist,sav,master"
skip = "uv.lock"

[build-system]
requires = ["uv_build>=0.9.8,<0.12.0"]
build-backend = "uv_build"
