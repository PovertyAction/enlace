# docs: https://github.com/DavidAnson/markdownlint/blob/v0.32.1/README.md

# default to true for all rules
default: true
customRules:
  - "./styles/quarto/custom-quarto-rules.js"
  - "./styles/quarto/additional-quarto-rules.js"
  - "./styles/quarto/quarto-image-rules.js"

# MD007/unordered-list-indent
MD007:
  indent: 2

# MD033/no-inline-html
MD033: false

# MD041/first-line-h1
MD041: false

# MD013/line-length
MD013: false

# MD024/no-duplicate-heading
MD024:
  # Allow when nested under different parents e.g. CHANGELOG.md
  siblings_only: true

# MD025/single-title/single-h1
# Disabled for Quarto templates which use multiple H1s for sections
MD025: false

# MD028/no-blanks-blockquote
# Disabled to allow blank lines in blockquotes
MD028: false

# MD029/ol-prefix - Ordered list item prefix
# Disabled for PDF extractions which often have inconsistent list numbering
MD029: false

MD038: false
MD036: false
